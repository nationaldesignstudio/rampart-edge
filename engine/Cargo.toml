[package]
name = "rampart-engine"
version = "3.0.0"
edition = "2021"
description = "Rampart Edge inference engine: fp32 forward of the 4-bit PII gate model, Rust -> wasm32 simd128, no imports"
license = "CC0-1.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
# Extra exports used only by the kernel/stage debugging harness; never in the shipped build.
test-exports = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
overflow-checks = false

[profile.dev]
panic = "abort"
