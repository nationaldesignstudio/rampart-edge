name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Tests (reference probabilities, spans, worker, redactor, engine parity vs archived browser ORT output)
        run: bun run test
      - run: bun run type-check
      - run: bun run build
